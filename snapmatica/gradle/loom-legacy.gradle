// Mixin setup for the yarn-mapped versions (1.21.1 / 1.21.4 / 1.21.11), which
// build against Loom 1.13 and still need the legacy annotation processor to
// emit a refmap. 26 needs none of this, so this script is applied only for the
// older versions.
//
// Written in Groovy on purpose: it resolves `loom` dynamically at execution
// time, so it does not have to compile against a Loom API that is absent from
// half of the subprojects' classpaths.
loom {
    mixin {
        useLegacyMixinAp = true
        add sourceSets.main, 'snapmatica.refmap.json'
    }
}
